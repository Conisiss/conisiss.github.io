<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตรวจหวย ดูหวย ดาวน์โหลดฟรี</title>
<meta name="description" content="ตรวจผลสลากกินแบ่งรัฐบาล สแกน QR บนสลาก ดูผลสด ดาวน์โหลดฟรีบน Google Play และ App Store">
<meta property="og:title" content="ตรวจหวย ดูหวย ดาวน์โหลดฟรี">
<meta property="og:description" content="ตรวจผลรางวัล สแกน QR บนสลาก ดูผลสด ดาวน์โหลดฟรีบน Google Play และ App Store">
<meta property="og:image" content="https://conisiss.github.io/img/truathuay-share.jpg">
<meta property="og:url" content="https://conisiss.github.io/download/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../img/truathuay.png">
<script>
  // Send phones straight to the right store; computers see both buttons + a QR code.
  (function () {
    var ua = navigator.userAgent || '';
    var play = 'https://play.google.com/store/apps/details?id=com.conisiss.lottocheck';
    var apple = 'https://apps.apple.com/th/app/id6832919254';
    var iOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    if (iOS) { location.replace(apple); }
    else if (/Android/i.test(ua)) { location.replace(play); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0B2B6A; --gold: #F5C518; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--navy); color: #fff;
         font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; text-align: center; padding: 32px 16px; }
  img.icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { margin: 18px 0 4px; font-size: 30px; }
  p { margin: 0 0 24px; color: rgba(255,255,255,.8); }
  .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .btn { display: inline-block; min-width: 190px; padding: 12px 22px; border-radius: 16px; background: #fff; color: var(--navy);
         text-decoration: none; text-align: left; line-height: 1.2; }
  .btn small { display: block; font-size: 12px; color: #5a6680; }
  .btn b { font-size: 20px; }
  .qr { margin-top: 28px; }
  .qr img { width: 150px; height: 150px; border-radius: 12px; background: #fff; padding: 6px; }
  .qr div { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 6px; }
  .note { margin-top: 28px; font-size: 12px; color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<main>
  <img class="icon" src="../img/truathuay.png" alt="ตรวจหวย ดูหวย">
  <h1>ตรวจหวย ดูหวย</h1>
  <p>ตรวจผลรางวัล สแกน QR บนสลาก ดูผลสด ดาวน์โหลดฟรี</p>
  <div class="btns">
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.conisiss.lottocheck"><small>ดาวน์โหลดได้ที่</small><b>Google Play</b></a>
    <a class="btn" href="https://apps.apple.com/th/app/id6832919254"><small>ดาวน์โหลดได้ที่</small><b>App Store</b></a>
  </div>
  <div class="qr">
    <img src="../img/download-qr.png" alt="QR code สำหรับดาวน์โหลด">
    <div>สแกนด้วยมือถือเพื่อดาวน์โหลด</div>
  </div>
  <div class="note">แอปสำหรับตรวจผลรางวัล ไม่ใช่แอปของสำนักงานสลากกินแบ่งรัฐบาล</div>
</main>
</body>
</html>
